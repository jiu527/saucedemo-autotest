[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --alluredir=allure-results --clean-alluredir --strict-markers
markers =
    smoke: 真实站点冒烟用例（走外网）
    wait: wait_utils 第 1 层基础等待自测（本地页面）
    action: wait_utils 第 2 层交互自测（本地页面）
    login: 登录相关用例（预留）
    inventory: 库存页相关用例（走外网）
    cart: 购物车相关用例（走外网）
    checkout: 结账相关用例（走外网）
